<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Duel di Restoran Mi</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#aebaa6;color:#fff2d4;font:14px system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;cursor:default}
button,select{font:inherit;color:#f4e8cd;background:#4c3829;border:1px solid #8b7152;border-radius:8px;padding:10px 18px;cursor:pointer}button:hover,button:focus-visible{background:#ddb46e;color:#30241f}button:focus-visible,select:focus-visible{outline:2px solid #ffe0a0;outline-offset:3px}
.controls{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:9px;padding:10px;background:#30241ff2;border:1px solid #c6a26066;border-radius:14px;box-shadow:0 8px 30px #2a1f1633}#play{background:#e9bf75;color:#30241f;min-width:86px}
.subtitle{position:fixed;bottom:106px;left:50%;transform:translateX(-50%);text-align:center;width:min(680px,90%);pointer-events:none;text-shadow:0 2px 5px #21180e}.subtitle strong{display:inline-block;color:#ffda86;font-size:10px;letter-spacing:2px;background:#30241fd9;border-radius:5px;padding:5px 10px}.subtitle p{margin:6px 0;background:#30241fe8;border:1px solid #c6a26055;border-radius:10px;padding:11px 18px;font-size:16px;line-height:1.5}
.rubric-panel{position:fixed;right:22px;top:22px;width:310px;max-height:calc(100vh - 125px);overflow:auto;background:#30241ff2;border:1px solid #c6a26088;border-radius:12px;padding:15px;font-size:11px;color:#e4d3b5}.rubric-panel h2{font:normal 20px Georgia,serif;margin:0 0 10px}.rubric-panel p{line-height:1.5;margin:8px 0}.rubric-panel select{width:100%;margin-bottom:5px;padding:9px}.rubric-panel button{display:block;text-align:left;width:100%;margin:5px 0;font-size:11px;padding:8px 10px}.rubric-panel a{color:#ffd794}.rubric-panel small{display:block;color:#b9a88e;line-height:1.5}.rubric-panel[hidden],.error[hidden]{display:none}.error{position:fixed;top:20px;left:50%;transform:translateX(-50%);max-width:90%;padding:12px 18px;border-radius:8px;background:#502b21}
@media(max-width:650px){.controls{bottom:14px}.subtitle{bottom:96px}.subtitle p{font-size:13px}.rubric-panel{right:12px;top:12px;width:calc(100% - 24px);max-height:calc(100vh - 115px)}}
</style></head><body>
<canvas id="mycanvas" aria-label="Duel 3D Kai, Oogway, dan Mr. Ping di restoran mi"></canvas>

<aside id="rubric-panel" class="rubric-panel" hidden><h2>Penilaian per karakter</h2><select id="rubric-character" aria-label="Karakter penilaian"><option value="kai">Kai</option><option value="oogway">Oogway</option><option value="ping">Mr. Ping / Shifu</option></select><div id="rubric-content"></div><a href="presentasi.html" target="_blank" rel="noopener">Peta 10 kriteria × 3 karakter ↗</a></aside>
<section class="controls" aria-label="Kontrol animasi"><button id="play" aria-pressed="false">Play</button><button id="rubric-toggle" aria-expanded="false" aria-controls="rubric-panel">Penilaian</button></section>

</body></html>
