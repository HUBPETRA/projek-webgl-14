<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Duel di Restoran Mi</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#aebaa6;color:#fff2d4;font:14px system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;cursor:default}
button,select{font:inherit;color:#f4e8cd;background:#4c3829;border:1px solid #8b7152;border-radius:8px;padding:10px 18px;cursor:pointer}button:hover,button:focus-visible{background:#ddb46e;color:#30241f}button:focus-visible,select:focus-visible{outline:2px solid #ffe0a0;outline-offset:3px}
.controls{max-width:calc(100% - 24px);flex-wrap:wrap;justify-content:center;align-items:center;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:9px;padding:10px;background:#30241ff2;border:1px solid #c6a26066;border-radius:14px;box-shadow:0 8px 30px #2a1f1633}#play{background:#e9bf75;color:#30241f;min-width:86px}
.subtitle{position:fixed;bottom:106px;left:50%;transform:translateX(-50%);text-align:center;width:min(680px,90%);pointer-events:none;text-shadow:0 2px 5px #21180e}.subtitle strong{display:inline-block;color:#ffda86;font-size:10px;letter-spacing:2px;background:#30241fd9;border-radius:5px;padding:5px 10px}.subtitle p{margin:6px 0;background:#30241fe8;border:1px solid #c6a26055;border-radius:10px;padding:11px 18px;font-size:16px;line-height:1.5}
.error[hidden]{display:none}.error{position:fixed;top:20px;left:50%;transform:translateX(-50%);max-width:90%;padding:12px 18px;border-radius:8px;background:#502b21}
@media(max-width:650px){.controls{bottom:14px}.subtitle{bottom:96px}.subtitle p{font-size:13px}}

.record-subtitle-option{display:flex;align-items:center;gap:7px;width:100%;justify-content:center;font-size:11px;color:#e4d3b5}
.record-subtitle-option input{accent-color:#e9bf75}.recording-help{width:100%;text-align:center;color:#d4c1a1;font-size:10px}
.subtitle{bottom:185px}.recording-message{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#4c3829;padding:10px 16px;border-radius:8px;max-width:90%}
.ui-hidden .recording-ui,.ui-hidden .subtitle{display:none!important}
.ui-hidden.keep-subtitles .subtitle{display:block!important;bottom:28px}
.ui-hidden canvas{cursor:none}body:fullscreen{background:#aebaa6}
@media(max-width:650px){.controls{width:calc(100% - 24px);gap:6px;padding:8px}.controls button{padding:8px 10px;font-size:12px}.subtitle{bottom:205px}}

</style></head><body>
<canvas id="mycanvas" aria-label="Duel 3D Kai, Oogway, dan Mr. Ping di restoran mi"></canvas>
<div class="error" id="error" role="alert" hidden></div>
<div class="subtitle" id="subtitles"><strong id="speaker"></strong><p id="dialogue"></p></div>
<section class="controls recording-ui" aria-label="Kontrol animasi"><button id="play" aria-pressed="false">Play</button><button id="restart" title="R: ulangi dari awal">Ulangi</button>
<button id="fullscreen" aria-pressed="false">Fullscreen</button>
<button id="hide-ui" aria-pressed="false" title="H: tampilkan kembali UI">Sembunyikan UI</button>
<label class="record-subtitle-option"><input id="record-subtitles" type="checkbox">Tetap tampilkan subtitle saat UI disembunyikan</label>
<small class="recording-help">Space: play/pause · R: ulangi · F: fullscreen · H: hide/show UI · Esc: keluar fullscreen</small>
</section>
<p id="recording-message" class="recording-message recording-ui" role="status" hidden></p>
