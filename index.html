<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelompok 14 - Kung Fu Panda WebGL</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f1713;
            font-family: Arial, sans-serif;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .info {
            position: fixed;
            left: 18px;
            top: 16px;
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.48);
            padding: 12px 14px;
            border-radius: 10px;
            line-height: 1.45;
            pointer-events: none;
        }

        .info strong {
            display: block;
            margin-bottom: 4px;
        }

        .names {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 10;
            color: white;
            background: rgba(0, 0, 0, 0.42);
            padding: 8px 16px;
            border-radius: 999px;
            pointer-events: none;
            white-space: nowrap;
        }
        .info { max-width: 380px; font-size: 13px; }
        .toolbar {position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:min(96%,690px);padding:10px;background:#101c18e8;border:1px solid #456152;border-radius:14px;}
        button {padding:9px 13px;border:1px solid #466354;border-radius:7px;background:#203c2e;color:#e5efe7;cursor:pointer;}
        button:hover,button[aria-pressed="true"]{background:#a5d3aa;color:#102718;}
        #status {color:#b6d8bd;margin-top:6px;}
        @media(max-width:600px){.info{font-size:11px;top:8px;left:8px;max-width:270px}.toolbar{bottom:8px}button{padding:7px 9px}}
    </style>
</head>
<body>
    <div class="info">
        <strong>Kelompok 14 — WebGL 3D</strong>
        Drag: orbit camera<br>
        Scroll: zoom<br>
        Double click: reset camera
        <div id="status"></div>
    </div>

    <nav class="toolbar" aria-label="Kontrol model">
        <button data-character="-1" aria-pressed="true">Semua</button>
        <button data-character="0" aria-pressed="false">Shifu</button>
        <button data-character="1" aria-pressed="false">Oogway</button>
        <button data-character="2" aria-pressed="false">Kai</button>
        <button id="front">Depan</button><button id="side">Samping</button><button id="back">Belakang</button>
        <button id="spin" aria-pressed="false">Putar otomatis</button>
    </nav>

    <canvas id="mycanvas"></canvas>

    <script src="libs.js"></script>
    <script src="shader.js"></script>

    <script src="core/MyObject.js"></script>
    <script src="core/Camera.js"></script>

    <script src="objects/Ellipsoid.js"></script>
    <script src="objects/Cylinder.js"></script>
    <script src="objects/Cone.js"></script>
    <script src="objects/EllipticParaboloid.js"></script>
    <script src="objects/EllipticParaboloidSection.js"></script>
    <script src="objects/TruncatedCone.js"></script>
    <script src="objects/HyperboloidOneSheet.js"></script>
    <script src="objects/Torus.js"></script>
    <script src="objects/ExtrudedPolygon.js"></script>
    <script src="objects/Bezier.js"></script>

    <script src="characters/CharacterUtils.js"></script>
    <script src="characters/Shifu.js"></script>
    <script src="characters/Oogway.js"></script>
    <script src="characters/Kai.js"></script>

    <script src="main.js"></script>
</body>
</html>
